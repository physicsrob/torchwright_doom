[project]
name = "torchwright-doom"
version = "0.1.0"
description = "DOOM rendering and game graph compilation, built on torchwright."
requires-python = ">=3.10"
# torchwright is provided by the workspace (umbrella declares it as a
# dep, installed editable) or by add_local_python_source on Modal —
# intentionally NOT listed below. The deps below mirror torchwright's
# runtime deps + our own so the venv has everything torchwright_doom
# code transitively imports. Sync with torchwright/pyproject.toml
# when its runtime deps change.
#
dependencies = [
    "torch",
    "onnx",
    "ortools>=9.10",
    "pydantic>=2.0",
    "numpy",
    "transformers>=5.0",
    "accelerate",
    "safetensors",
    "tokenizers",
]

# black + mypy + ruff back the `make lint` gate (which gates `make
# test`) — declared here so a clean `uv sync` provides the toolchain
# this repo's Makefile invokes.
[dependency-groups]
dev = [
    "pytest",
    "modal",
    "black",
    "mypy",
    "ruff",
]

# ONNX Runtime is diagnostic/test-only. Production compilation and rendering
# use direct safetensors + stock Transformers and never import ORT.
test-onnx = [
    "onnxruntime-gpu==1.26.0; python_version >= '3.11'",
    "onnxruntime-gpu; python_version < '3.11'",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

# Explicit: flat-layout auto-discovery refuses to build once non-package
# top-level dirs exist (out/, configs/ are data, not code).
[tool.setuptools.packages.find]
include = ["torchwright_doom*"]

[tool.pytest.ini_options]

[tool.coverage.run]
source = ["torchwright_doom"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
ignore_missing_imports = true

# The vendored ``pydoom`` package (the plain-Python renderer + drafter copied
# near-verbatim from the original implementation) carries the original's looser
# type annotations — e.g. ``_Context.md: object``. Its correctness is pinned by
# runtime token-identity gates (``tests/scene/test_flat_pixel_oracle.py`` drives
# the whole frame through the compiled graph), not by static types; rewriting
# ~4,900 lines of verbatim code to satisfy mypy would only risk transcription
# drift. Skip type-checking it.
[[tool.mypy.overrides]]
module = "torchwright_doom.pydoom.*"
ignore_errors = true
