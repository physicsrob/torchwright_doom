# Windowed-cache gate config: the local-L4 d3072 gate point on the
# permanent/expiring slot policy (ModelConfig.cache_window).  Sized so a
# 980-token gate rollout EXERCISES RECYCLING: total positions = 3,613
# prefill + 980 = 4,593; permanent rows (everything except the 91 pixel
# rows in that stream) = 4,502.  cache_window 4544 sits between the two,
# so the window fills at position 4,544 and the last ~49 rows allocate
# by recycling pixel slots — while every permanent row stays resident.
# Gate contract: token-identical to the unbounded L4 run at 980
# (configs/e1m1_l4_d3072.yaml), since nothing the protocol reads at
# range ever expires.
wad: doom1.wad
model: {d: 3072, d_head: 32, scale: 4, cache_window: 4544}
region: {x1: 627.2, y1: -3760.0, x2: 1395.2, y2: -2800.0}
textures:
  wall: [BROWN1, BROWN144, COMPUTE2, DOOR3, DOORSTOP, LITE3, STARTAN3, STEP6, SUPPORT2]
  flat: [CEIL3_5, FLAT14, FLAT5_5, FLOOR4_8, FLOOR7_1, F_SKY1]
