# THE PRODUCTION renderer configuration — full-resolution 320x200 via DOOM
# low-detail (the 3D view is computed at 160 columns; the host paints each
# column 2 screen pixels wide).  `make run`, the Makefile default, and
# every doc reference point here; update this file in place.
#
# TWO configs are committed and maintained (see CLAUDE.md,
# "Configurations"): this PRODUCTION one and configs/e1m1_lowres.yaml (a
# faster 160x100 low-detail preview).  Everything else is a /tmp variant.
#
# State: scale 1 = 320x200 low-detail, d=8192 / decoupled 16k MLP,
# CP-SAT schedule (optimize: 2 — the 180s budget is a deliberate cap, do
# not raise it back to 3; a solver-validated schedule can be pre-seeded
# into the schedule cache instead, see depth_experiments_log.md).
# Position is RoPE (rotary
# attention, d_rot=64 partial); recency reads use the gain-8 global-position
# tiebreak (RECENCY_GAIN, render_constants.py).  Rendered by the native
# HuggingFace model (the production runtime) with an unbounded KV cache.
# Certified against the pydoom reference at 320x200: 100% pixel coverage,
# ~99.99% within-option color (96.5% exact), ~53,748-token rollout.
wad: doom1.wad
model: {d: 8192, d_head: 128, d_rot: 64, scale: 1, detail: low, hud: true, d_hidden: 16384, optimize: 2, bias: false}
region: {x1: 627.2, y1: -3760.0, x2: 1395.2, y2: -2800.0}
textures:
  wall: [BROWN1, BROWN144, COMPUTE2, DOOR3, DOORSTOP, LITE3, STARTAN3, STEP6, SUPPORT2]
  flat: [CEIL3_5, FLAT14, FLAT5_5, FLOOR4_8, FLOOR7_1, F_SKY1]
# Render-job runtime defaults — THE single source (CLI flags override
# field-by-field).  Runtime knobs only: none enter the compile-cache key.
run:
  # Covers the full 320x200 low-detail frame (~53,748 tokens) with headroom;
  # the cap sizes the RoPE global-position recovery range (the BOS-weight PWL
  # in global_position_from_bos) and bounds content dominance for recency
  # (match_gain > RECENCY_GAIN * max_positions); an oversized demand makes
  # empty_past() reject before prefill.
  max_positions: 61440
  # Prefill chunk size: a memory knob bounding the per-pass transient
  # activations; semantically identical to a single pass.
  prefill_chunk_size: 128
  # E1M1 start room, world coordinates (map data, like region:).
  pose: {x: 1056.0, y: -3616.0, angle: 64, viewz: 41.0}
