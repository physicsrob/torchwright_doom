# Local-L4 gate config for the CUDA-graph static-cache work (Gate 1/2).
# d=2048 does NOT compile (the Phase-J forward runs out of residual columns:
# "No progress: 7644 nodes remaining, 0 free columns"); d=3072 is the gate
# point that compiles and fits the L4's 24 GB once densified by ORT.
wad: doom1.wad
# cache_stride 4608: prefill ~3613 + the 400-token gate rollout + headroom
# (a full-frame cache does not fit the L4 next to ~14 GB of weights).
model: {d: 3072, d_head: 32, scale: 4, cache_stride: 4608}
region: {x1: 627.2, y1: -3760.0, x2: 1395.2, y2: -2800.0}
textures:
  wall: [BROWN1, BROWN144, COMPUTE2, DOOR3, DOORSTOP, LITE3, STARTAN3, STEP6, SUPPORT2]
  flat: [CEIL3_5, FLAT14, FLAT5_5, FLOOR4_8, FLOOR7_1, F_SKY1]
